<!DOCTYPE html>
<html lang="en">
<head>
<script>
  // Set theme + season before first paint to avoid a flash of the wrong look
  (function () {
    var root = document.documentElement;
    var saved = null;
    try { saved = localStorage.getItem("schoolCountdownTheme"); } catch (e) {}
    var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
    root.setAttribute("data-theme", saved || (prefersDark ? "dark" : "light"));

    // Autumn look runs Sep–Nov. Preview any time with ?season=fall
    var forced = new URLSearchParams(location.search).get("season");
    var month = new Date().getMonth(); // 0 = Jan
    if (forced === "fall" || (!forced && month >= 8 && month <= 10)) {
      root.setAttribute("data-season", "fall");
    }
  })();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>School Year Countdown</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Nunito:wght@400;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="autumn.css">
</head>
<body>

  <!-- Drifting leaves (filled by autumn.js, fall only) -->
  <div class="leaf-field" id="leaf-field" aria-hidden="true"></div>

  <div class="board">

    <!-- ===== Header banner ===== -->
    <header class="header">
      <div class="pin pin--red header__pin header__pin--left" aria-hidden="true"></div>
      <div class="pin pin--red header__pin header__pin--right" aria-hidden="true"></div>
      <h1 class="header__title" id="year-title">School Year Countdown</h1>
      <p class="header__subtitle" id="year-subtitle">tracking every day from the first bell to the last</p>
    </header>

    <!-- ===== Metric sticky notes ===== -->
    <section class="metrics" id="metrics" aria-label="Key countdown metrics">
      <!-- filled by script.js -->
    </section>

    <!-- ===== Hero: next event live countdown (click for a gust of leaves in fall) ===== -->
    <section class="hero" id="hero">
      <div class="pin pin--gold hero__pin" aria-hidden="true"></div>
      <p class="hero__eyebrow" id="hero-eyebrow">up next</p>
      <h2 class="hero__title" id="hero-title">—</h2>
      <p class="hero__date" id="hero-date">—</p>
      <div class="hero__clock" id="hero-clock" role="timer" aria-live="off">
        <div class="clock__unit"><span class="clock__num" id="clock-days">00</span><span class="clock__label">days</span></div>
        <div class="clock__colon">:</div>
        <div class="clock__unit"><span class="clock__num" id="clock-hours">00</span><span class="clock__label">hrs</span></div>
        <div class="clock__colon">:</div>
        <div class="clock__unit"><span class="clock__num" id="clock-mins">00</span><span class="clock__label">min</span></div>
        <div class="clock__colon">:</div>
        <div class="clock__unit"><span class="clock__num" id="clock-secs">00</span><span class="clock__label">sec</span></div>
      </div>
    </section>

    <!-- ===== Corkboard grid of pinned event cards ===== -->
    <p class="grid-hint">⏳ hover (or tab to) a badge below to watch it count down live</p>
    <section class="board__grid" id="events-grid" aria-label="School year events">
      <!-- filled by script.js -->
    </section>

    <footer class="board__footer">
      pinned up for the <span id="footer-year">2026–2027</span> school year
    </footer>

    <!-- Leaf pile along the bottom edge (filled by autumn.js, fall only) -->
    <div class="leaf-pile" id="leaf-pile" aria-hidden="true"></div>

  </div>

  <button id="theme-toggle" class="theme-toggle" type="button" aria-pressed="false" aria-label="Switch to night mode">
    <span class="theme-toggle__icon" id="theme-toggle-icon" aria-hidden="true">🌙</span>
  </button>

<script src="script.js"></script>
<script src="autumn.js"></script>
</body>
</html>
